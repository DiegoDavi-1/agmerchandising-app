workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Merch Hub App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.merchhub.app
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: pod install --project-directory=ios
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          NEXT_BUILD_NUMBER=$((27 + BUILD_NUMBER))
          flutter build ipa --release --build-number="$NEXT_BUILD_NUMBER" --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
  ios-smoke:
    name: iOS Simulator Smoke Test
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      java: 17
      vars:
        MAESTRO_CLI_NO_ANALYTICS: "1"
    scripts:
      - name: Run Flutter tests
        script: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub
      - name: Prepare iPhone simulator
        script: |
          set -euo pipefail
          mkdir -p build/ios-smoke/screenshots
          xcrun simctl list devices available --json > build/ios-smoke/devices.json
          SIMULATOR_UDID=$(python3 - <<'PY'
          import json
          with open("build/ios-smoke/devices.json") as source:
              devices = [d for group in json.load(source)["devices"].values() for d in group]
          for name in ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro"):
              matches = [d for d in devices if d["name"] == name]
              if matches:
                  print(matches[0]["udid"])
                  break
          else:
              raise SystemExit("No supported iPhone simulator available: " + ", ".join(d["name"] for d in devices))
          PY
          )
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Build and install app for simulator
        script: |
          set -euo pipefail
          flutter build ios --simulator --debug --config-only --no-codesign
          pod install --project-directory=ios
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/ios-smoke/DerivedData \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
            > build/ios-smoke/xcodebuild.log 2>&1 || {
              tail -n 100 build/ios-smoke/xcodebuild.log
              exit 1
            }
          xcrun simctl install "$SIMULATOR_UDID" build/ios-smoke/DerivedData/Build/Products/Debug-iphonesimulator/Runner.app
      - name: Test terms and login on iOS
        script: |
          set -euo pipefail
          if ! command -v maestro >/dev/null 2>&1; then
            curl -fsSL https://get.maestro.mobile.dev -o "$HOME/install-maestro.sh"
            bash "$HOME/install-maestro.sh"
          fi
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          maestro --device "$SIMULATOR_UDID" test \
            --format junit --output build/ios-smoke/results.xml \
            --debug-output build/ios-smoke/maestro .maestro/ios-smoke.yaml
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ios-smoke/screenshots/login.png
          sips -g pixelWidth -g pixelHeight build/ios-smoke/screenshots/login.png
          python3 - <<'PY'
          import struct
          with open("build/ios-smoke/screenshots/login.png", "rb") as source:
              header = source.read(24)
          if len(header) != 24 or header[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Simulator screenshot is not a valid PNG")
          size = struct.unpack(">II", header[16:24])
          if size not in ((1179, 2556), (1206, 2622)):
              raise SystemExit(f"Screenshot size {size} does not match the required 6.1/6.3-inch iPhone group")
          print(f"Required screenshot size verified: {size[0]} x {size[1]}")
          PY
    artifacts:
      - build/ios-smoke/screenshots/*.png
      - build/ios-smoke/results.xml
      - build/ios-smoke/xcodebuild.log
      - build/ios-smoke/devices.json
      - build/ios-smoke/maestro/**/*
